[package]
name = "refactor-runtime"
version = "0.1.0"
edition = "2021"
description = "A CLI tool that scans codebases, builds dependency graphs, rewrites imports on file moves, and detects cascading impact of code changes"

[[bin]]
name = "refactor-runtime"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# File system
walkdir = "2"

# Dependency graph
petgraph = "0.6"

# AST parsing
tree-sitter = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CSV logging
csv = "1"

# Parallel processing
rayon = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# Path handling
pathdiff = "0.2"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUID for task IDs
uuid = { version = "1", features = ["v4"] }

# Regex for pattern matching
regex = "1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
