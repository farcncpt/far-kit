<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Field Trip — Relay</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      padding: 16px;
      width: 320px;
    }
    h1 { font-size: 16px; color: #58a6ff; margin-bottom: 4px; }
    .subtitle { font-size: 11px; color: #8b949e; margin-bottom: 14px; }
    .status-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .status-row:last-child { margin-bottom: 0; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot.green { background: #3fb950; box-shadow: 0 0 6px #3fb95060; }
    .dot.red { background: #f85149; }
    .label { font-size: 12px; }
    .value { font-size: 12px; color: #8b949e; margin-left: auto; }
    .actions { display: flex; gap: 6px; margin-bottom: 10px; }
    .config-row {
      display: flex; align-items: center; gap: 6px; margin-bottom: 10px;
    }
    .config-row label { font-size: 12px; min-width: 35px; }
    .config-row input {
      background: #0d1117; border: 1px solid #30363d; border-radius: 4px;
      color: #c9d1d9; padding: 4px 8px; font-size: 12px; width: 70px;
    }
    button {
      background: #21262d; border: 1px solid #30363d; border-radius: 5px;
      color: #c9d1d9; padding: 5px 12px; font-size: 12px; cursor: pointer; flex: 1;
    }
    button:hover { background: #30363d; }
    button.primary { background: #238636; border-color: #2ea04366; }
    button.primary:hover { background: #2ea043; }
    button.danger { background: #da3633; border-color: #f8514966; }
    button.danger:hover { background: #f85149; }
    .log-container {
      background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
      padding: 8px; max-height: 150px; overflow-y: auto;
      font-family: 'SF Mono', 'Fira Code', monospace; font-size: 11px; line-height: 1.5;
    }
    .log-entry { color: #8b949e; white-space: pre-wrap; word-break: break-all; }
    .log-entry.info { color: #58a6ff; }
    .log-entry.success { color: #3fb950; }
    .log-entry.error { color: #f85149; }
    .log-entry.command { color: #d2a8ff; }
    .section-title { font-size: 11px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    .hint { font-size: 10px; color: #484f58; margin-top: 8px; text-align: center; }
  </style>
</head>
<body>
  <h1>Field Trip Relay</h1>
  <p class="subtitle">CLI bridge — persists in background</p>

  <div class="status-card">
    <div class="status-row">
      <span class="dot red" id="dot-relay"></span>
      <span class="label">Relay Server</span>
      <span class="value" id="status-relay">Checking...</span>
    </div>
    <div class="status-row">
      <span class="dot" id="dot-cmds" style="background:#30363d"></span>
      <span class="label">Commands</span>
      <span class="value" id="status-cmds">0</span>
    </div>
  </div>

  <div class="config-row">
    <label for="port-input">Port:</label>
    <input type="number" id="port-input" value="9333" min="1024" max="65535" />
    <button class="primary" id="btn-connect">Connect</button>
    <button class="danger" id="btn-disconnect" style="display:none">Disconnect</button>
  </div>

  <div class="actions">
    <button id="btn-sidepanel">Side Panel</button>
  </div>

  <div class="section-title">Activity Log</div>
  <div class="log-container" id="log"></div>

  <p class="hint">Relay runs in background — close this popup anytime</p>

  <script src="./popup.js"></script>
</body>
</html>
